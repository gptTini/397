schema_version: "1.0"
project:
  id: "CSPM397"
  repo: "gptTini/397"
  name: "Chrono-Synaptic Program Machine"
  short_name: "CSPM"
  status: "BOOTSTRAP"
  source_of_truth: "CSPM_SOT.yaml"
  updated_utc: "2026-08-19T20:05:00Z"

mission:
  research_question: >-
    Can repeated language-model computation be represented as predictable temporal
    state transitions and replaced by memory + compiled multi-step macros + residual
    correction while preserving model behavior and reducing real end-to-end latency?
  non_goal:
    - "Do not treat CSPM as a way to brute-force full Qwen3.5-397B-A17B inference on weak local hardware."
    - "Do not claim success from latent similarity alone."
    - "Do not claim speedup from FLOP reduction alone."
  final_397_role:
    - "offline knowledge teacher"
    - "offline trajectory teacher"
    - "offline macro-discovery/compiler teacher"
    - "rare difficult-case repair teacher"

operating_mode:
  raw_mode: true
  raw_mode_scope: "ChatSol/CSPM project only"
  human_pretty_reports_default: false
  charts_default: false
  duplicate_summaries_default: false
  rule: >-
    Worker sessions emit only compact machine-readable handoffs and raw artifacts
    unless the orchestrator explicitly requests human-readable interpretation.

invariants:
  - "NO_HIDDEN_STATE"
  - "NO_SILENT_FALLBACK"
  - "NO_OVERWRITE"
  - "NO_UNVERSIONED_DATA"
  - "NO_UNTESTED_CONTRACT_CHANGE"
  - "NO_SELF_MERGE"
  - "NO_RESULT_WITHOUT_BASELINE"
  - "NO_RESULT_WITHOUT_REPRODUCTION"
  - "NO_RESULT_WITHOUT_SCIENCE_AUDIT"
  - "GITHUB_MAIN_IS_INTEGRATION_SOURCE_OF_TRUTH"
  - "LARGE_RUN_ARTIFACTS_ARE_NOT_COMMITTED_TO_GIT"
  - "EVERY_RUN_HAS_CONFIG_SEED_CODE_SHA_DATA_SHA_AND_ARTIFACT_HASHES"

sessions:
  S0:
    name: "ORCHESTRATOR_BOOTSTRAP"
    branch: "cspm/orchestrator"
    active_initially: true
    owns:
      - "CSPM_SOT.yaml"
      - "AGENTS.md"
      - "docs/contracts/**"
      - "docs/decisions/**"
      - "docs/experiments/**"
      - ".github/**"
    responsibilities:
      - "freeze contracts before experiments"
      - "issue tasks with acceptance criteria"
      - "maintain experiment registry and gate state"
      - "integrate only reviewed changes"
      - "never reinterpret failed gates as passes"
  S1:
    name: "TRACELAB"
    branch: "cspm/tracelab"
    active_initially: true
    owns:
      - "src/cspm/trace/**"
      - "tests/trace/**"
      - "experiments/exp001_trace/**"
    responsibilities:
      - "model instrumentation"
      - "trace capture"
      - "trace fidelity"
      - "trace I/O accounting"
  S2:
    name: "STATE_PREDICTABILITY"
    branch: "cspm/state"
    active_initially: true
    owns:
      - "src/cspm/state/**"
      - "tests/state/**"
      - "experiments/exp002_predictability/**"
      - "experiments/exp003_compiler_state/**"
    responsibilities:
      - "predictability spectrum"
      - "learned compiler state"
      - "multi-horizon predictors"
      - "behavior-preservation probes"
  S3:
    name: "SYNAPTIC_MEMORY"
    branch: "cspm/memory"
    active_initially: false
    activation_gate: "G2"
    owns:
      - "src/cspm/memory/**"
      - "tests/memory/**"
      - "experiments/exp004_memory/**"
  S4:
    name: "MACRO_COMPILER"
    branch: "cspm/macro"
    active_initially: false
    activation_gate: "G2"
    owns:
      - "src/cspm/macro/**"
      - "tests/macro/**"
      - "experiments/exp005_macro/**"
  S5:
    name: "RESIDUAL_NEUROCORE"
    branch: "cspm/neurocore"
    active_initially: false
    activation_gate: "G4"
    owns:
      - "src/cspm/neurocore/**"
      - "tests/neurocore/**"
      - "experiments/exp006_residual/**"
  S6:
    name: "RUNTIME_PROFILER"
    branch: "cspm/runtime"
    active_initially: false
    activation_gate: "G5"
    owns:
      - "src/cspm/runtime/**"
      - "tests/runtime/**"
      - "experiments/exp007_router/**"
      - "experiments/exp008_e2e/**"
  S7:
    name: "REVIEWER_CI"
    branch: "cspm/reviewer"
    active_initially: true
    owns:
      - "tests/reviewer/**"
      - "experiments/exp009_ablation/**"
      - "review/**"
    responsibilities:
      - "independent reproduction"
      - "baseline verification"
      - "statistics and confidence intervals"
      - "OOD and adversarial checks"
      - "regression checks"
      - "review PRs without trusting worker claims"
  S8:
    name: "397_TEACHER"
    branch: "cspm/397-teacher"
    active_initially: false
    activation_gate: "G7"
    owns:
      - "src/cspm/teacher397/**"
      - "experiments/exp010_397/**"

branch_policy:
  base: "main"
  worker_self_merge: false
  cross_session_file_edit: false
  contract_change_requires:
    - "explicit S0 task"
    - "tests"
    - "S7 review"
  worker_flow:
    - "sync latest main"
    - "read CSPM_SOT.yaml"
    - "verify assigned ownership"
    - "implement only assigned task"
    - "run tests"
    - "write raw manifest"
    - "commit"
    - "open PR"
    - "emit RAW-HANDOFF"

artifact_policy:
  git:
    allowed:
      - "source"
      - "tests"
      - "small deterministic fixtures"
      - "configs"
      - "schemas"
      - "manifests"
      - "small raw metrics"
    forbidden_by_default:
      - "model weights"
      - "large tensors"
      - "full hidden-state traces"
      - "large benchmark outputs"
  raw_formats:
    tensor:
      - ".safetensors"
      - ".npy"
    event_log:
      - ".jsonl"
    config:
      - ".json"
      - ".yaml"
    manifest:
      - ".json"
  required_run_identity:
    - "run_id"
    - "experiment_id"
    - "code_sha"
    - "config_sha256"
    - "dataset_sha256"
    - "seed"
    - "started_at"
    - "completed_at"
    - "artifact_path"
    - "artifact_sha256"

raw_handoff:
  version: "1"
  required_fields:
    - "SESSION"
    - "STATUS"
    - "TASK"
    - "BRANCH"
    - "HEAD"
    - "BASE"
    - "COMMANDS"
    - "TESTS"
    - "METRICS"
    - "ARTIFACTS"
    - "ERRORS"
    - "DECISION"
    - "NEXT"
  allowed_status:
    - "PASS"
    - "FAIL"
    - "BLOCKED"
    - "PARTIAL"
  template: |-
    RAW-HANDOFF v1
    SESSION=<Sx>
    STATUS=<PASS|FAIL|BLOCKED|PARTIAL>
    TASK=<task_id>
    BRANCH=<branch>
    HEAD=<sha>
    BASE=<main_sha>
    COMMANDS=<json-array>
    TESTS=<json-object>
    METRICS=<json-object>
    ARTIFACTS=<json-array path+sha256>
    ERRORS=<json-array>
    DECISION=<READY_FOR_REVIEW|REWORK|BLOCKED>
    NEXT=<task_or_none>

contracts:
  versioning: "semantic contract versioning; never silently mutate a consumed schema"
  required_contracts:
    trace_v1:
      producer: "S1"
      consumers: ["S2", "S7"]
    compiler_state_v1:
      producer: "S2"
      consumers: ["S3", "S4", "S5", "S7"]
    memory_v1:
      producer: "S3"
      consumers: ["S4", "S6", "S7"]
    macro_v1:
      producer: "S4"
      consumers: ["S5", "S6", "S7"]
    runtime_event_v1:
      producer: "S6"
      consumers: ["S7"]

experiments:
  EXP000:
    name: "BOOTSTRAP_PIPELINE"
    owner: "S0"
    reviewer: "S7"
    gate: "G0"
    purpose: "prove deterministic config -> run -> raw artifact -> manifest -> reproduction pipeline"
  EXP001:
    name: "TRACE_FIDELITY"
    owner: "S1"
    reviewer: "S7"
    gate: "G1"
    measures:
      - "output/logit drift"
      - "trace missing rate"
      - "runtime overhead"
      - "disk bytes per token"
  EXP002:
    name: "PREDICTABILITY_SPECTRUM"
    owner: "S2"
    reviewer: "S7"
    horizons: [1, 2, 4, 8, 16]
    baselines:
      - "identity"
      - "mean"
      - "linear"
      - "low_rank"
      - "nearest_neighbor"
      - "small_mlp"
    measures:
      - "mse"
      - "cosine"
      - "r2"
      - "token_kl"
      - "topk_overlap"
      - "next_token_preservation"
      - "ood_degradation"
  EXP003:
    name: "LEARNED_COMPILER_STATE"
    owner: "S2"
    reviewer: "S7"
    representations:
      - "raw_hidden"
      - "pca"
      - "autoencoder"
      - "predictive_encoder"
      - "contrastive_predictive_encoder"
    gate: "G2"
  EXP004:
    name: "SYNAPTIC_MEMORY"
    owner: "S3"
    reviewer: "S7"
    gate: "G3"
    compare_equal_byte_budget:
      - "dense_kv"
      - "nearest_neighbor"
      - "vector_index"
      - "sparse_synaptic_graph"
  EXP005:
    name: "MACRO_COMPILER"
    owner: "S4"
    reviewer: "S7"
    gate: "G4"
  EXP006:
    name: "RESIDUAL_NEUROCORE"
    owner: "S5"
    reviewer: "S7"
    gate: "G5"
    baselines:
      - "no_correction"
      - "linear"
      - "mlp"
      - "recurrent_residual"
      - "full_recompute"
  EXP007:
    name: "CHRONO_ROUTER"
    owner: "S6"
    reviewer: "S7"
    gate: "G6"
    fallback_order: [8, 4, 2, 1, "full_compute"]
  EXP008:
    name: "END_TO_END"
    owner: "S6"
    reviewer: "S7"
    gate: "G7"
  EXP009:
    name: "ABLATION_OOD"
    owner: "S7"
    reviewer: "S7_independent_reproduction"
    ablations:
      - "minus_memory"
      - "minus_macro"
      - "minus_residual"
      - "minus_router"
      - "minus_predictive_state"
      - "minus_prefetch"
  EXP010:
    name: "397_TEACHER"
    owner: "S8"
    activation_gate: "G7"

gates:
  G0:
    status: "PENDING"
    condition: "bootstrap pipeline reproducible from clean checkout"
  G1:
    status: "LOCKED"
    unlock_after: "G0"
    condition: "trace capture is faithful, complete, and overhead-accounted"
  G2:
    status: "LOCKED"
    unlock_after: "G1"
    condition: >-
      Multi-step compiler-state prediction, including horizon 4, beats simple
      baselines and preserves downstream behavior on held-out and OOD probes.
  G3:
    status: "LOCKED"
    unlock_after: "G2"
    condition: "memory method provides useful retrieval/latency/byte-budget tradeoff"
  G4:
    status: "LOCKED"
    unlock_after: "G2"
    condition: >-
      Recurrent trajectory structure can be compiled into accepted macros whose
      saved real compute exceeds lookup+routing+failure costs.
  G5:
    status: "LOCKED"
    unlock_after: "G4"
    condition: "residual correction recovers behavior cheaper than full recomputation"
  G6:
    status: "LOCKED"
    unlock_after: "G5"
    condition: "router is calibrated and unsafe false-accept rate is controlled"
  G7:
    status: "LOCKED"
    unlock_after: "G6"
    condition: >-
      Full CSPM shows reproducible end-to-end Pareto improvement: target quality
      loss <=1%, latency improvement >=20%, no large OOD regression, >=3 seeds,
      and a 95% confidence interval excluding zero improvement.

runtime_metrics:
  required:
    - "quality"
    - "tokens_per_second"
    - "ttft_ms"
    - "abat_ms"
    - "flops_per_token_est"
    - "ram_bytes_peak"
    - "vram_bytes_peak"
    - "disk_bytes_per_token"
    - "macro_acceptance_rate"
    - "fallback_rate"
    - "entry_ms"
    - "memory_ms"
    - "router_ms"
    - "macro_ms"
    - "residual_ms"
    - "output_ms"
    - "fallback_ms"
    - "io_ms"
    - "total_ms"

fallback_policy:
  silent_fallback: false
  every_fallback_event_requires:
    - "requested_horizon"
    - "rejected_reason"
    - "chosen_fallback"
    - "confidence"
    - "fallback_cost_ms"

failure_policy:
  rule: >-
    A failed scientific gate is not a software bug by default. Record the failure,
    test one or two predeclared redesigns, and if the gate still fails, narrow or
    kill the hypothesis rather than moving success criteria after seeing results.
  no_posthoc_gate_relaxation: true

initial_activation:
  active_sessions: ["S0", "S1", "S2", "S7"]
  waiting_sessions: ["S3", "S4", "S5", "S6", "S8"]
  immediate_sequence:
    - "S0: complete Bootstrap v1 and EXP000"
    - "S7: independently validate EXP000 and contracts"
    - "S1: start EXP001 only after G0 PASS"
    - "S2: prepare interfaces but do not claim EXP002 results before G1 PASS"

change_control:
  SOT_updates:
    owner: "S0"
    requires_reason: true
    science_gate_changes_require:
      - "pre-result justification"
      - "S7 approval"
      - "recorded decision entry"
  ownership_changes_require:
    - "S0 approval"
    - "SOT update before code change"
