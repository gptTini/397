name: CSPM CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  wave1-gates:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned CI tooling
        run: python -m pip install --disable-pip-version-check ruff==0.16.3 mypy==2.3.0 build==1.5.0
      - name: Compile Python sources/tests
        run: python -m compileall -q src experiments tests .github/workflows scripts
      - name: Enforce PR ownership scope
        if: github.event_name == 'pull_request'
        run: >-
          python scripts/check_scope.py
          --branch "${{ github.head_ref }}"
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
      - name: Formatting gate
        run: python .github/workflows/quality_paths.py format
      - name: Lint gate
        run: python .github/workflows/quality_paths.py lint
      - name: Type gate
        run: python .github/workflows/quality_paths.py type
      - name: Import-boundary gate
        run: python .github/workflows/check_import_boundaries.py
      - name: Bootstrap + unit tests
        run: >-
          python .github/workflows/run_tests.py
          tests/test_bootstrap.py
          tests/test_contract_migration.py
          tests/test_wave1_unlock.py
          tests/unit
      - name: Contract tests
        run: python .github/workflows/run_tests.py tests/contract
      - name: Integration tests
        run: python .github/workflows/run_tests.py tests/integration
      - name: Adversarial tests
        run: python .github/workflows/run_tests.py tests/adversarial
      - name: Regression tests
        run: python .github/workflows/run_tests.py tests/regression
      - name: Deterministic EXP000 smoke
        run: python experiments/exp000_bootstrap/run.py --out runs/exp000/ci_smoke --seed 397 --sample-count 32
      - name: Package build
        run: python -m build --no-isolation --wheel --sdist
