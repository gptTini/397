name: CSPM CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: EXP000 smoke
        run: python experiments/exp000_bootstrap/run.py --out runs/exp000/ci_smoke --seed 397 --sample-count 32
